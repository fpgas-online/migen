# What kind of packaging repository this is, and why it differs from the
# defaults: mithro/apt-repo-action's docs/packaging.md ("The declaration").
#
# A mirror: `packaging` (this branch, no history in common with migen's)
# holds the build and the sync; master and every other branch and tag of
# git.m-labs.hk are exact copies of upstream's, and a moved master is built
# and published straight away (docs/packaging.md, "Mirrors").
kind = "mirror"
upstream = "https://git.m-labs.hk/M-Labs/migen.git"
architectures = "all"
suites = ["bookworm", "trixie", "forky", "sid"]

[mirror]
build = "master"
# The archived GitHub m-labs/migen this repository was forked from.
ours = ["github-master", "legacy", "experimental"]
tags = "[0-9]*"

[exceptions]
PKG-SUITES = "fpgas.online uses it"
