name: Sync upstream

# Copies every branch and tag of git.m-labs.hk here exactly and, when master
# moved, starts "Debian packages" to build and publish it: the shared
# mirror sync (mithro/apt-repo-action, docs/packaging.md "Mirrors"), driven
# by .github/apt-packaging.toml.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push the copies
  actions: write # start deb.yml

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    uses: mithro/apt-repo-action/.github/workflows/sync-mirror.yml@main
